[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "re-source-ai"
version = "0.4.0"
description = "Research Recovery Console: evidence-first scientific integrity pilot"
requires-python = ">=3.11"
dependencies = ["scikit-learn>=1.8", "numpy>=2.0", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7"]
ui = ["streamlit>=1.40,<2.0"]

[tool.setuptools]
packages = ["resource_ai"]
